[package]
name = "scarlet"
license.workspace = true
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1"
witch-common = { path = "../../witch/common" }
bytemuck = { version = "1", features = ["derive"] }
flexi_logger = "0"
log = "0"

[lib]
name = "scarlet"
crate-type = ["cdylib"]

[target.'cfg(target_os = "windows")'.dependencies]
hudhook = { version = "0", default-features = false, features = [
	"dx11", "dx12",
	"imgui-docking"
] }
# this has to match hudhook because windows-rs can't keep types consistent!
windows = { version = "0.54.0", default-features = false, features = [
	"Foundation",
	"Win32_System", "Win32_System_Threading", "Win32_System_LibraryLoader",
	"Win32_System_SystemServices"
] }
